name: 'Terraform'

on:
  push:
    branches: [ "main", "stage", "develop" ]
  pull_request:
    branches: [ "main", "stage", "develop" ]
  workflow_dispatch:
    branches: [ "main" ]
permissions:
  contents: read

jobs:
  terraform-plan:
    name: 'Terraform-Plan'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_VAR_project_id: ${{ secrets.TF_VAR_project_id }}
      TF_VAR_region: ${{ secrets.TF_VAR_region }}
      TF_VAR_vpc_name: ${{ secrets.TF_VAR_vpc_name }}
    
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - uses: actions/checkout@v4
      
      - name: Autenticate to GCP 
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check
      
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan 

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ steps.branch.outputs.name }}
          path: ./terraform/tfplan

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' 
    
    # picks environment based on branch
    environment: ${{ github.ref_name == 'main' && 'production' }}
    
    permissions:
      contents: read
      id-token: write

    env:
      TF_VAR_project_id: ${{ secrets.TF_VAR_project_id }}
      TF_VAR_region: ${{ secrets.TF_VAR_region }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ steps.branch.outputs.name }}
          path: ./terraform
      - name: Check files
        run: |
          echo "Current directory:"
          pwd
          echo "Files here:"
          ls -la
      - name: Terraform Apply
        # working-directory: terraform
        run: |
          ls -la
          terraform apply -auto-approve tfplan

